name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: swift build -c release --arch arm64
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -C "$(swift build -c release --arch arm64 --show-bin-path)" -czf "activity-recall-${version}-macos-arm64.tar.gz" activity-recall
          shasum -a 256 "activity-recall-${version}-macos-arm64.tar.gz"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes activity-recall-*-macos-arm64.tar.gz
      - uses: jdx/packslip@693d02c49f6e1c8a0cc797472dc3fa53f0a6c955 # v1.9.1
        with:
          artifacts: activity-recall-*-macos-arm64.tar.gz
          bin: activity-recall
